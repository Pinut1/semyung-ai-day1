<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL 연습장</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; padding:28px 20px 60px; font-family:"맑은 고딕","Malgun Gothic",sans-serif;
         background:#f4f6f8; color:#1c2733; line-height:1.7; }
  .wrap { max-width:1180px; margin:0 auto; }
  h1 { margin:0 0 6px; font-size:26px; }
  .sub { margin:0 0 22px; color:#5b6b7c; }

  .cols { display:grid; grid-template-columns: 330px 1fr; gap:20px; align-items:start; }
  .card { background:#fff; border-radius:14px; padding:24px;
          box-shadow:0 2px 16px rgba(0,0,0,.08); }

  /* 미션 */
  .card h2 { margin:0 0 4px; font-size:17px; }
  .card .hint { margin:0 0 16px; color:#7b8794; font-size:13px; }
  .mission { display:block; width:100%; text-align:left; background:#f8fafc;
             border:1px solid #e3e8ed; border-radius:8px; padding:11px 13px;
             margin-bottom:8px; cursor:pointer; font:inherit; font-size:14px;
             color:#1c2733; line-height:1.45; }
  .mission:hover { background:#eef4ff; border-color:#b9cdf5; }
  .mission:focus-visible { outline:3px solid #2563eb; outline-offset:2px; }
  .mission b { display:block; font-size:14px; margin-bottom:2px; }
  .mission span { color:#7b8794; font-size:12.5px; }
  .mission.warn-m { background:#fff6e5; border-color:#f3d9a4; }
  .mission.warn-m:hover { background:#ffefd0; }

  /* 에디터 */
  .toolbar { display:flex; gap:8px; align-items:center; margin:0 0 12px; flex-wrap:wrap; }
  .toolbar .grow { flex:1; }
  textarea { width:100%; min-height:130px; resize:vertical;
             font-family:Consolas,"D2Coding",monospace; font-size:16px; line-height:1.6;
             background:#1c2733; color:#fff; border:none; border-radius:10px;
             padding:16px 18px; }
  textarea:focus { outline:3px solid #2563eb; outline-offset:2px; }
  button { font:inherit; cursor:pointer; border:none; border-radius:8px; padding:10px 18px; }
  .run { background:#2563eb; color:#fff; font-weight:700; font-size:16px; padding:12px 26px; }
  .run:hover { background:#1d4ed8; }
  .run:disabled { background:#9db4e0; cursor:default; }
  .ghost { background:#eef1f4; color:#1c2733; }
  .ghost:hover { background:#e0e5ea; }
  .kbd { color:#7b8794; font-size:13px; }

  /* 결과 */
  .result { margin-top:18px; }
  .msg { padding:13px 16px; border-radius:8px; font-size:15px; }
  .msg.ok { background:#e9f7ef; border-left:4px solid #16a34a; }
  .msg.err { background:#fdecec; border-left:4px solid #dc2626; }
  .msg.err b { display:block; font-family:Consolas,"D2Coding",monospace;
               font-size:14px; margin-top:6px; word-break:break-all; }
  .msg.info { background:#eef1f4; border-left:4px solid #7b8794; color:#5b6b7c; }
  .tablewrap { overflow-x:auto; margin-top:12px; }
  table { border-collapse:collapse; width:100%; font-size:15px; }
  th, td { border:1px solid #e3e8ed; padding:9px 12px; text-align:left; white-space:nowrap; }
  th { background:#f4f6f8; font-size:13px; color:#5b6b7c; font-weight:700; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  td.null { color:#b0b8c1; font-style:italic; }
  .rowcount { margin-top:8px; color:#7b8794; font-size:13.5px; }

  .loading { text-align:center; padding:38px 20px; color:#5b6b7c; }
  .bar { height:6px; background:#e3e8ed; border-radius:3px; overflow:hidden;
         max-width:340px; margin:14px auto 0; }
  .bar i { display:block; height:100%; width:35%; background:#2563eb; border-radius:3px;
           animation:slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0%{margin-left:-35%} 100%{margin-left:100%} }
  @media (prefers-reduced-motion: reduce) { .bar i { animation:none; width:100% } }

  .back { display:inline-block; margin-top:24px; color:#2563eb;
          text-decoration:none; font-size:15px; }
  .back:hover { text-decoration:underline; }

  @media (max-width: 900px) {
    .cols { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>SQL 연습장</h1>
  <p class="sub">도서 목록 표(<code>books</code>)가 이미 만들어져 있습니다. 왼쪽 미션을 눌러 하나씩 해보세요.</p>

  <div id="boot" class="card loading">
    <div><b id="boot-title">PostgreSQL을 내려받는 중입니다…</b></div>
    <div style="font-size:14px;margin-top:4px" id="boot-sub">처음 한 번만 걸립니다. (약 5MB · 다음부터는 바로 열립니다)</div>
    <div class="bar" id="boot-bar"><i></i></div>
  </div>

  <script>
  /* 모듈이 아예 못 뜨는 경우(파일 누락·차단)를 잡아 무한 로딩을 막는다 */
  window.__pgReady = false;
  function bootFail(detail) {
    if (window.__pgReady) return;
    var b = document.getElementById('boot');
    if (!b || b.hidden) return;
    b.innerHTML = '<div class="msg err" style="text-align:left">' +
      '열지 못했습니다. <b>새로고침(F5)</b>을 한 번 해보고, 그래도 안 되면 선생님을 부르세요.' +
      (detail ? '<b>' + String(detail).replace(/[&<>]/g, '') + '</b>' : '') + '</div>';
  }
  window.addEventListener('error', function (e) {
    if (e.target && e.target.tagName === 'SCRIPT') bootFail('스크립트를 불러오지 못했습니다');
    else if (e.message) bootFail(e.message);
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    bootFail(e.reason && e.reason.message);
  });
  setTimeout(function () {
    var t = document.getElementById('boot-sub');
    if (!window.__pgReady && t) t.textContent = '아직 받는 중입니다. 인터넷이 느리면 1분까지 걸릴 수 있어요.';
  }, 15000);
  setTimeout(function () { bootFail('시간이 너무 오래 걸립니다'); }, 90000);
  </script>

  <div id="app" class="cols" hidden>
    <div class="card">
      <h2>미션</h2>
      <p class="hint">누르면 오른쪽에 문장이 들어갑니다</p>
      <div id="missions"></div>
      <button class="ghost" id="reset" style="width:100%;margin-top:14px">표 처음 상태로 되돌리기</button>
    </div>

    <div class="card">
      <div class="toolbar">
        <button class="run" id="run">실행</button>
        <span class="kbd">Ctrl + Enter</span>
        <span class="grow"></span>
        <button class="ghost" id="clear">지우기</button>
      </div>
      <textarea id="sql" spellcheck="false" aria-label="SQL 입력">SELECT * FROM books;</textarea>
      <div class="result" id="result"></div>
    </div>
  </div>

  <a class="back" href="./">← 실습 파일 받는 곳으로</a>
</div>

<script type="module">
import { PGlite } from './pglite/index.js';

const SCHEMA = `
CREATE TABLE books (
  id           SERIAL PRIMARY KEY,
  title        TEXT NOT NULL,
  author       TEXT NOT NULL,
  price        INT NOT NULL,
  is_borrowed  BOOLEAN DEFAULT false,
  added_at     TIMESTAMP DEFAULT now()
);
INSERT INTO books (title, author, price, is_borrowed, added_at) VALUES
  ('어린 왕자',       '생텍쥐페리',       12000, false, now() - interval '20 days'),
  ('데미안',          '헤르만 헤세',      11000, true,  now() - interval '16 days'),
  ('수레바퀴 아래서', '헤르만 헤세',      10500, false, now() - interval '12 days'),
  ('총, 균, 쇠',      '재레드 다이아몬드', 22000, false, now() - interval '8 days'),
  ('사피엔스',        '유발 하라리',      24000, true,  now() - interval '4 days'),
  ('코스모스',        '칼 세이건',        19800, false, now() - interval '1 days');
`;

const MISSIONS = [
  { n:'1', t:'표 안을 들여다보기',
    d:'어떤 칸이 있는지 먼저 확인한다',
    sql:'SELECT * FROM books;' },
  { n:'2', t:'일부러 틀려보기', warn:true,
    d:'price 는 숫자 칸이다. 글자를 넣으면?',
    sql:"INSERT INTO books (title, author, price)\nVALUES ('토지', '박경리', '이만원');" },
  { n:'3', t:'책 한 권 넣기',
    d:'이번엔 제대로. 숫자는 따옴표 없이',
    sql:"INSERT INTO books (title, author, price)\nVALUES ('토지', '박경리', 20000);" },
  { n:'4', t:'조건 걸어 꺼내기',
    d:'아직 안 빌려간 책만',
    sql:'SELECT title, price FROM books\nWHERE is_borrowed = false;' },
  { n:'5', t:'줄 세우기',
    d:'비싼 것부터 · 최근 들어온 3권',
    sql:'SELECT * FROM books ORDER BY price DESC;\n\n-- 아래 줄만 남기고 위를 지워도 됩니다\n-- SELECT * FROM books ORDER BY added_at DESC LIMIT 3;' },
  { n:'6', t:'세어 보기',
    d:'작가별로 몇 권인지',
    sql:'SELECT author, COUNT(*) FROM books\nGROUP BY author;' },
  { n:'7', t:'고치고 지우기',
    d:'1번 책을 대출 처리했다가 지워보기',
    sql:'UPDATE books SET is_borrowed = true WHERE id = 1;\n\n-- 확인한 뒤에 아래를 실행해 보세요\n-- DELETE FROM books WHERE id = 1;' },
];

const $ = (id) => document.getElementById(id);
const box = $('result');
let db;

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function fmt(v) {
  if (v === null || v === undefined) return { html:'NULL', cls:'null' };
  if (typeof v === 'boolean') return { html: v ? 'true' : 'false', cls:'' };
  if (typeof v === 'number' || typeof v === 'bigint') return { html: String(v), cls:'num' };
  if (v instanceof Date) {
    const p = (n) => String(n).padStart(2, '0');
    return { html: `${v.getFullYear()}-${p(v.getMonth()+1)}-${p(v.getDate())} ` +
                   `${p(v.getHours())}:${p(v.getMinutes())}`, cls:'' };
  }
  return { html: esc(v), cls:'' };
}

function renderTable(res) {
  const cols = res.fields.map(f => f.name);
  const head = cols.map(c => `<th>${esc(c)}</th>`).join('');
  const body = res.rows.map(r => {
    return '<tr>' + cols.map(c => {
      const { html, cls } = fmt(r[c]);
      return `<td class="${cls}">${html}</td>`;
    }).join('') + '</tr>';
  }).join('');
  return `<div class="tablewrap"><table><thead><tr>${head}</tr></thead>` +
         `<tbody>${body}</tbody></table></div>` +
         `<p class="rowcount">${res.rows.length}줄</p>`;
}

async function run() {
  const sql = $('sql').value.trim();
  if (!sql) return;
  $('run').disabled = true;
  try {
    const results = await db.exec(sql);
    const last = results[results.length - 1];
    if (last && last.fields && last.fields.length) {
      box.innerHTML = last.rows.length
        ? renderTable(last)
        : `<div class="msg info">조건에 맞는 줄이 없습니다.</div>` + renderTable(last);
    } else {
      const n = results.reduce((s, r) => s + (r.affectedRows || 0), 0);
      box.innerHTML = `<div class="msg ok">실행됐습니다. ${n}줄이 바뀌었습니다.</div>`;
    }
  } catch (e) {
    box.innerHTML = `<div class="msg err">여기서 막혔습니다.<b>${esc(e.message)}</b></div>`;
  } finally {
    $('run').disabled = false;
  }
}

async function reset() {
  await db.exec('DROP TABLE IF EXISTS books;');
  await db.exec(SCHEMA);
  box.innerHTML = `<div class="msg ok">표를 처음 상태로 되돌렸습니다. 책 6권이 들어 있습니다.</div>`;
}

(async () => {
  try {
    db = await PGlite.create();
    await db.exec(SCHEMA);
  } catch (e) {
    $('boot').innerHTML =
      `<div class="msg err">시작하지 못했습니다. 새로고침해 보고, 그래도 안 되면 선생님을 부르세요.` +
      `<b>${esc(e.message)}</b></div>`;
    return;
  }

  $('missions').innerHTML = MISSIONS.map((m, i) =>
    `<button class="mission${m.warn ? ' warn-m' : ''}" data-i="${i}">` +
    `<b>${m.n}. ${esc(m.t)}</b><span>${esc(m.d)}</span></button>`).join('');

  $('missions').addEventListener('click', (e) => {
    const btn = e.target.closest('.mission');
    if (!btn) return;
    $('sql').value = MISSIONS[btn.dataset.i].sql;
    $('sql').focus();
  });

  $('run').addEventListener('click', run);
  $('clear').addEventListener('click', () => { $('sql').value = ''; $('sql').focus(); });
  $('reset').addEventListener('click', reset);
  $('sql').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
  });

  window.__pgReady = true;
  $('boot').hidden = true;
  $('app').hidden = false;
  await run();
})();
</script>
</body>
</html>
